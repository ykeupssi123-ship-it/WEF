# =====================================================================
# DIMENSIONNEMENT RESSOURCES (RAM / DISQUE / HEAP JVM)
# AJOUTE LE 2026-08-11 - avant cette date, ES_024/LS_017 fixaient un
# heap de 4 Go chacun EN DUR, et ES_B001_RAM_CHECK exigeait 14 Go de
# RAM EN DUR (le vrai besoin pour tourner confortablement, cf. tableau
# ci-dessous) - aucune des deux valeurs n'etait modifiable sans editer
# le code des jobs. Desormais tout est ici, comme pour le reste du
# projet ("aucune valeur en dur dans les jobs : tout vient de vars.conf").
#
# RESOURCE_PROFILE est purement INFORMATIF (n'est lu par aucun job) -
# il documente pour vous/vos lecteurs quel profil les valeurs
# ci-dessous representent actuellement. Changez-le en meme temps que
# vous changez les valeurs, pour que le fichier reste honnete.
#
# ---------------------------------------------------------------------
# TABLEAU DE RISQUE PAR PALIER DE RAM TOTALE DE LA MACHINE ELK_HOST
# (Elasticsearch + Logstash + Wazuh indexer + manager + dashboard, TOUS
# sur la meme VM comme dans ce projet - AGENT_HOST/VM2 n'a pas ce
# probleme, Filebeat/Metricbeat/agent Wazuh sont legers, quelques
# dizaines de Mo chacun, pas de JVM a dimensionner) :
#
#   1 Go  -> INUTILISABLE pour ELK_HOST. L'OS seul en consomme deja une
#            part significative. Aucun des 3 moteurs JVM (ES, Logstash,
#            wazuh-indexer) ne peut demarrer de facon fiable en parallele
#            d'un autre. Reserve a un AGENT_HOST minimal (1 seul beat).
#   2 Go  -> INSUFFISANT pour la stack complete. Tout au plus UN SEUL
#            moteur JVM (ex. Elasticsearch seul, heap ~256-384m) pourrait
#            demarrer isolement pour un test tres ponctuel. ES+LS+
#            wazuh-indexer ensemble = echec quasi certain (OOM/kill).
#   3 Go  -> DEMO LEGERE POSSIBLE mais fragile (c'est le palier de ce
#            projet au moment de l'ecriture, VM a 3,5 Go). Heaps reduits
#            au minimum viable (voir valeurs par defaut ci-dessous).
#            AUCUNE marge pour un pic de charge : les jobs de test de
#            resilience du blueprint (WAZ_018_NET crash reseau,
#            WAZ_027/ES_051 crash trigger, ES_046 STRESSTESTPIPE) risquent
#            de ne pas redemarrer proprement faute de RAM disponible -
#            a executer avec prudence, voire a sauter, sur ce palier.
#            Adapte a UNE demo ponctuelle a faible trafic, pas a un
#            usage continu ni a un vrai volume de logs.
#   4 Go  -> Un peu plus de marge (heaps ~768m-1g chacun). Toujours
#            reserve a un labo/demo, pas a un usage soutenu.
#   8 Go  -> Minimum correct pour un usage de TEST soutenu (pas juste une
#            demo ponctuelle) - heaps ~1,5-2g chacun, marge OS correcte.
#   14-16 Go (IDEAL / VALEUR D'ORIGINE DU PROJET, cf. ES_B001_RAM_CHECK
#            avant le 2026-08-11) -> Dimensionnement pense pour un usage
#            reel avec un volume de logs de production. Heaps a 4g
#            chacun (ES_024/LS_017 avant parametrage), marge OS large,
#            tolere sans risque tous les jobs de test de resilience du
#            blueprint. C'EST LA VALEUR A VISER des que ce projet sort
#            du cadre demo/labo.
#
# Meme logique cote DISQUE : LS_016 reservait 10 Go EN DUR pour la
# persistent queue Logstash - viable sur un disque de 50 Go+, mais
# incompatible avec un disque de 30 Go (deja ~7 Go pris par l'OS + les
# binaires ES/LS/KB/Wazuh a eux seuls, voir onglet MAINTENANCE_MNT du
# blueprint Excel pour le detail d'un incident reel de disque plein).
# LS_PQ_MAX_BYTES ci-dessous corrige ca pour un disque de 30 Go - a
# remonter vers 10gb si votre disque depasse 50-60 Go.
# ---------------------------------------------------------------------
RESOURCE_PROFILE="DEMO_LEGER"          # DEMO_LEGER (valeurs actuelles, 4 Go RAM / 30 Go disque) ou PRODUCTION (visez 14-16 Go RAM, heaps 4g, LS_PQ_MAX_BYTES=10gb)
MIN_RAM_GB_REQUIRED=3                  # lu par ES_B001_RAM_CHECK - laisse a 3 volontairement : "free -g" arrondit a l'entier inferieur et une VM annoncee a 4 Go remonte souvent "3" (memoire reservee au kernel/hyperviseur) - a 4 en dur, le check aurait pu echouer sur une machine reellement correcte
ES_JVM_HEAP_SIZE="768m"                # lu par ES_024 - palier 4 Go du tableau ci-dessus ("heaps ~768m-1g chacun")
LS_JVM_HEAP_SIZE="768m"                # lu par LS_017 - palier 4 Go du tableau ci-dessus
WAZ_INDEXER_JVM_HEAP_SIZE="768m"       # lu par WAZ_013B - palier 4 Go du tableau ci-dessus
LS_PQ_MAX_BYTES="2gb"                  # lu par LS_016 - inchange : depend du DISQUE (30 Go), pas de la RAM, a remonter separement si le disque grandit
MIN_DISK_FREE_PCT=20                   # lu par ES_049 - inchange : depend du DISQUE, pas de la RAM

# ---------------------------------------------------------------------
# RETENTION DE L'HISTORIQUE PAR JOB (SYSOUT) - AJOUTE LE 2026-08-12
# Chaque execution d'un job laisse un fichier de log dedie
# (state/history/<JOB_ID>/*.log) + une ligne dans state/JOBS_HISTORY.csv
# - l'equivalent fonctionnel d'une SYSOUT JCL/mainframe par run. Sans
# purge, ce dossier grossit indefiniment. En vrai mainframe, la SYSOUT a
# elle-meme une politique d'expiration (le job ET son catalogue
# disparaissent ensemble apres N jours, pas juste le contenu).
# HISTORY_RETENTION_DAYS=7 : coherent avec le cadre DEMO de ce projet
# (RESOURCE_PROFILE=DEMO_LEGER) - suffisant pour retrouver l'historique
# d'une semaine de tests/depannage sans accumuler indefiniment. En
# PRODUCTION reelle, remontez cette valeur selon la politique de
# conformite/audit du client (30, 90, 365 jours...).
# La purge (maintenance/MNT_purge_historique.sh) tourne automatiquement
# au demarrage de chaque ./orchestrator.sh (silencieuse, rapide) - et
# reste aussi lancable seule a tout moment.
HISTORY_RETENTION_DAYS=7

# ---------------------------------------------------------------------
# ALERTE PAR EMAIL SUR ECHEC DE JOB - AJOUTE LE 2026-08-12
# Le plus gros manque reel face a un centre d'exploitation 24/7 : sans
# ca, un job qui echoue ne fait qu'ecrire un log - personne n'est
# prevenu tant qu'un humain ne va pas le lire. notifier.sh envoie un
# email des qu'orchestrator.sh ou forcer_job.sh rencontre un echec.
#
# NOTIF_ENABLED=non par defaut, EXPRES : tant que SMTP_USER/SMTP_PASS_FILE
# ne sont pas renseignes, aucune tentative d'envoi n'est faite (on ne
# devine jamais des identifiants, on ne tente jamais un envoi voue a
# l'echec en silence).
#
# SMTP_PASS_FILE pointe vers un fichier SEPARE (jamais ce vars.conf,
# jamais livre dans l'archive de deploiement) contenant uniquement le
# mot de passe, en clair, sur une seule ligne. Le dossier secrets/ est
# deja present dans l'archive (livre volontairement vide, voir
# secrets/README_SECRETS.txt) - inutile de le recreer a chaque machine/
# mise a jour, une seule commande suffit :
#   echo 'le_mot_de_passe' > secrets/smtp_password.txt
#   chmod 600 secrets/smtp_password.txt
#
# Exemple pour contact@ankrr.fr (compte Zimbra Starter OVH - verifie
# sur la documentation officielle OVHcloud le 2026-08-12) :
#   NOTIF_ENABLED="oui"
#   SMTP_HOST="smtp.mail.ovh.net"   # ou ssl0.ovh.net (equivalent, cf. doc OVH)
#   SMTP_PORT=465                   # SSL/TLS
#   SMTP_USER="contact@ankrr.fr"    # identifiant = adresse email complete
#   SMTP_PASS_FILE="$INSTALL_DIR/secrets/smtp_password.txt"
#   NOTIF_FROM="contact@ankrr.fr"
#   NOTIF_TO="contact@ankrr.fr"
# Mot de passe : celui du compte Zimbra contact@ankrr.fr (le meme que
# pour se connecter au Webmail https://webmail.mail.ovh.net/). Pour le
# consulter/reinitialiser : espace client OVH -> Web Cloud -> Emails ->
# Zimbra -> Ankrr -> Compte email -> menu "..." sur la ligne
# contact@ankrr.fr -> "Modifier le mot de passe".
#
# AUTRE FOURNISSEUR QUE OVH (ajoute le 2026-08-12, suite a une question
# legitime sur la portabilite de ce template) : deux familles de
# chiffrement TLS existent chez les fournisseurs SMTP, PAS
# interchangeables - notifier.sh les gere toutes les deux :
#   - TLS IMPLICITE (port 465 typique) -> deduit automatiquement si
#     SMTP_PORT=465, sinon forcable via SMTP_TLS_MODE="ssl"
#   - STARTTLS (port 587 typique) -> deduit automatiquement pour tout
#     port different de 465, sinon forcable via SMTP_TLS_MODE="starttls"
# Vous n'avez normalement RIEN a toucher a SMTP_TLS_MODE (deduit du
# port) sauf cas non standard (port inhabituel).
#
# Voir README.md, section "Alerte par email" pour un tableau des
# reglages usuels par fournisseur (Gmail, Microsoft 365/Outlook,
# relais SMTP corporate) et leurs limites connues (authentification
# moderne/App Password souvent exigee par Gmail et Microsoft).
SMTP_TLS_MODE=""
NOTIF_ENABLED="non"
SMTP_HOST="smtp.mail.ovh.net"
SMTP_PORT=465
SMTP_USER=""
# Chemin par defaut, deja pointe vers le dossier secrets/ livre vide
# dans l'archive (voir plus haut) - il ne reste qu'a y deposer le mot
# de passe, jamais a modifier ce chemin sauf besoin particulier.
SMTP_PASS_FILE="${INSTALL_DIR}/secrets/smtp_password.txt"
NOTIF_FROM=""
NOTIF_TO=""

# ---------------------------------------------------------------------
# MISE A JOUR OS (ES_001) - COEXISTENCE AVEC D'AUTRES SERVICES SUR LE
# MEME SERVEUR
# AJOUTE LE 2026-08-11 : par defaut, ES_001 fait un `dnf update -y`
# COMPLET du systeme (idempotent depuis le correctif du meme jour : ne
# fait rien si deja a jour). Ca convient a un serveur DEDIE a ce
# projet, mais si ce serveur ELK_HOST heberge AUSSI d'autres services
# (une application tierce qui exige une version precise d'un paquet
# partage, par exemple) une mise a jour globale peut casser quelque
# chose qui n'a rien a voir avec ce projet - ce n'est pas hypothetique,
# c'est le risque normal d'un `dnf update -y` sans restriction sur un
# serveur mutualise.
#
# OS_UPDATE_MODE choisit le comportement d'ES_001 :
#   full     (defaut) -> dnf update -y complet. A utiliser sur un
#             serveur dedie a ce projet, ou vous savez qu'aucun autre
#             service ne depend d'une version figee d'un paquet.
#   security -> dnf update --security -y : seuls les correctifs de
#             securite sont installes, le reste du systeme (versions
#             des paquets applicatifs) n'est pas touche. Compromis
#             raisonnable sur un serveur partage : on ne laisse pas de
#             faille connue ouverte, sans risquer de casser un autre
#             service par une montee de version non liee a la securite.
#   skip     -> ES_001 ne fait RIEN (juste un message dans les logs).
#             A utiliser si la politique de mise a jour de ce serveur
#             est geree ailleurs (un autre outil, une autre equipe, un
#             abonnement/contrat de support qui l'interdit explicitement)
#             et que ce projet ne doit JAMAIS toucher au systeme
#             d'exploitation. Dans ce cas, la mise a jour du systeme
#             reste VOTRE responsabilite, hors de ce blueprint - la
#             stack ES/LS/KB/Wazuh peut tourner sur un OS non a jour,
#             mais ce n'est plus ce job qui vous en protege.
#
# OS_UPDATE_EXCLUDE_PACKAGES : liste de paquets (separes par des
# virgules, motifs dnf acceptes, ex. "httpd,php*") a NE JAMAIS toucher,
# quel que soit OS_UPDATE_MODE (full ou security) - le juste milieu
# entre "tout mettre a jour" et "ne rien toucher" : on protege
# uniquement ce dont depend l'autre service present sur ce serveur,
# sans renoncer a mettre a jour le reste. Ignore si OS_UPDATE_MODE=skip.
# Vide par defaut = aucune exclusion.
# ---------------------------------------------------------------------
OS_UPDATE_MODE="full"
OS_UPDATE_EXCLUDE_PACKAGES=""

# ---------------------------------------------------------------------
# PKI MAISON (TLS/SSL) - genere par les jobs PKI_001 a PKI_011
# Meme principe que wazuh_factory_2 : une CA interne au projet, sous
# notre controle, signe les certificats de tous les composants.
# ---------------------------------------------------------------------
PKI_CA_CN="ProductFactory Root CA"
PKI_DAYS=3650
PKI_DIR="/etc/pki/factory/certs"
CRYPTO_GROUP="factory_crypto"

# ---------------------------------------------------------------------
# MODE PKI - generation interne (par defaut) ou PKI externe deja
# fournie (environnement de production qui possede deja une CA
# d'entreprise et vous demande simplement de pointer dessus).
#
#   PKI_MODE=generate  (defaut) -> comportement actuel : PKI_003 a
#     PKI_007 fabriquent leur propre CA et signent le certificat
#     serveur eux-memes.
#
#   PKI_MODE=external -> PKI_003 a PKI_007 NE GENERENT PLUS RIEN et
#     n'exigent JAMAIS la cle privee de la CA (vous ne l'avez de toute
#     facon jamais, une PKI externe ne la partage pas). Ils attendent
#     simplement que ces 3 fichiers soient deja presents dans
#     ${PKI_DIR} avant le lancement de l'orchestrateur :
#       factory_ca.crt      (certificat/chaine de la CA d'entreprise)
#       factory_server.key  (cle privee du certificat serveur)
#       factory_server.crt  (certificat serveur deja signe par la CA)
#     Si l'un des trois manque, le job correspondant s'arrete avec une
#     erreur claire au lieu d'improviser une PKI a nous.
#
# DANS LES DEUX CAS, aucun autre job (ES/LS/KB/FB/MB/WAZ) n'a besoin
# d'etre modifie ou rejoue differemment : ils lisent tous
# ${PKI_DIR}/factory_ca.crt / factory_server.key / factory_fullchain.pem,
# jamais un chemin en dur - changer PKI_MODE ne change rien pour eux.
# ---------------------------------------------------------------------
PKI_MODE="generate"

# ---------------------------------------------------------------------
# Comptes systeme (fixes par les produits eux-memes, ne pas modifier)
# ---------------------------------------------------------------------
ES_USER="elasticsearch"
LS_USER="logstash"
KB_USER="kibana"
FB_USER="filebeat"
MB_USER="metricbeat"
WAZ_USER="wazuh"

# ---------------------------------------------------------------------
# Ports (standards des produits)
#
# CORRIGE LE 2026-08-30 (incident reel wef-elk-core, reproduit en reel,
# CORRIGE UNE SECONDE FOIS LE MEME JOUR - voir plus bas) :
# wazuh-indexer (fork OpenSearch) utilise les MEMES ports standard
# qu'Elasticsearch par defaut (9200 http, 9300 transport). Les deux
# services tournent EN PERMANENCE sur cette meme VM (wazuh-indexer =
# etat de repos "mode souverain" par defaut, Elasticsearch = pipeline
# ELK general via Logstash/Beats, independant de Wazuh - voir
# "Bascule Convergent/Souverain" plus bas dans ce fichier) : sans
# separation, WAZ_014/ES_026 (quel que soit celui qui demarre en
# second) echoue avec "BindException: Adresse deja utilisee" sur
# 127.0.0.1:9300.
#
# PREMIER ESSAI (abandonne) : deplacer wazuh-indexer vers 9201/9301 et
# garder Elasticsearch sur 9200/9300. Echec reel decouvert aussitot :
# l'outil OFFICIEL wazuh-passwords-tool.sh (utilise par WAZ_014A pour
# pousser le mot de passe admin) code le port 9200 EN DUR dans son
# propre script (deux occurrences : "-p 9200" transmis a
# securityadmin.sh), sans aucune option pour le changer - patcher un
# outil vendor livre avec le paquet Wazuh n'est pas une correction
# durable (ecrase a la prochaine mise a jour du paquet).
#
# CORRIGE (definitif) : c'est ELASTICSEARCH qui se decale, pas
# wazuh-indexer - wazuh-indexer reste sur le port attendu PAR TOUT
# L'OUTILLAGE VENDOR WAZUH (wazuh-passwords-tool.sh et probablement
# d'autres), zero configuration necessaire de notre cote (defauts
# OpenSearch inchanges). ES_PORT/ES_TRANSPORT_PORT (deja lus comme
# variables par ES_013/ES_014/ES_023 et tous les jobs ES_*/KB_*/LS_* -
# aucun de ces scripts n'a besoin d'etre modifie) changent de valeur.
# WAZ_INDEXER_PORT/WAZ_INDEXER_TRANSPORT_PORT valent desormais les
# defauts OpenSearch standard - conserves comme variables explicites
# (pas des valeurs en dur eparpillees dans WAZ_006/WAZ_014A/
# WAZ_020_VERIFY) pour que l'intention reste documentee si jamais un
# jour un outil vendor permet enfin de configurer son port.
ES_PORT=9202
ES_TRANSPORT_PORT=9302
WAZ_INDEXER_PORT=9200
WAZ_INDEXER_TRANSPORT_PORT=9300
KB_PORT=5601
LS_BEATS_PORT=5044
LS_SYSLOG_PORT=514
# CORRECTIF 2026-08-18 (incident reel : crash loop Netty
# RejectedExecutionException sur l'entree TCP syslog). Root cause reelle :
# le service logstash tourne sous l'utilisateur non-root "logstash" (voir
# LS_003) et un bind direct sur un port privilegie (<1024, ici 514) echoue
# systematiquement par EACCES. Logstash retente le demarrage du pipeline,
# l'event-loop-group Netty precedent se fait detruire en plein retry, et
# les taches encore en vol dessus remontent en RejectedExecutionException
# au lieu d'un simple "permission denied" lisible. LS_SYSLOG_PORT (514)
# reste le port PUBLIC/externe (celui que les expediteurs syslog visent
# et que LS_007 ouvre) ; LS_SYSLOG_INTERNAL_PORT est le port REEL sur
# lequel Logstash ecoute (non privilegie, jamais besoin de root/capability
# sur le binaire Java). LS_007 redirige 514 -> ce port via firewalld
# (port forwarding), meme principe qu'un reverse-proxy.
LS_SYSLOG_INTERNAL_PORT=5514
WAZ_AGENT_PORT=1514
WAZ_ENROLL_PORT=1515
WAZ_API_PORT=55000

# AJOUTE LE 2026-08-20 : port du tableau de bord visuel (toile de
# dependances, voir tableau_de_bord.py / installer_service_tableau_de_bord.sh).
# Service HTTP en LECTURE SEULE (jamais d'ecriture, jamais d'action
# declenchable depuis la page) - expose l'etat live des jobs sur le
# reseau local uniquement (pas d'authentification, choisir un port qui
# ne collisionne avec aucun autre service ci-dessus).
DASHBOARD_PORT=8088

# ---------------------------------------------------------------------
# Secrets (remplis automatiquement par les jobs eux-memes dans
# state/*.secret - jamais en dur ici, jamais commit en clair)
# ---------------------------------------------------------------------
# ES_050 genere le token d'ingestion mutualise -> state/factory_ingest_token.secret
# ES_022 genere le mot de passe bootstrap -> state/es_bootstrap.secret

# ---------------------------------------------------------------------
# NOMMAGE DES MACHINES (jobs INFRA_001/INFRA_002, isoles, supprimables)
# ---------------------------------------------------------------------
ELK_HOSTNAME="wef-elk-core"
BEATS_HOSTNAME="wef-beats-sensor"

# ---------------------------------------------------------------------
# DISTRIBUTION DE LA CA VERS BEATS_HOST (job DIST_001, VM2 uniquement)
# Cle SSH recommandee. Le mot de passe n'est JAMAIS rempli par nous ni
# transmis nulle part : si vous l'utilisez, deposez-le vous-meme dans le
# fichier ci-dessous, UNIQUEMENT sur VM2 (jamais dans ce vars.conf, qui
# est livre dans l'archive de deploiement) :
#   echo 'mot_de_passe' > secrets/factory_ssh_password.txt && chmod 600 secrets/factory_ssh_password.txt
# Conseil : changez le mot de passe root de vos VM apres l'avoir tape en
# clair dans un chat, et passez a une cle SSH des que possible.
#
# CORRIGE LE 2026-08-30 : ce vars.conf contenait auparavant le mot de
# passe root REEL des VM de l'usine, en clair, dans un fichier livre
# tel quel dans l'archive de deploiement (destinee a etre redeposee sur
# d'autres serveurs) - decouvert lors de l'audit de la reprise
# WAZ_020_VERIFY. Deplace vers secrets/ (jamais livre non plus - voir
# secrets/README_SECRETS.txt), meme discipline que SMTP_PASS_FILE.
# ---------------------------------------------------------------------
FACTORY_SSH_USER="root"
FACTORY_SSH_KEY=""
FACTORY_SSH_PASSWORD_FILE="${INSTALL_DIR}/secrets/factory_ssh_password.txt"

# ---------------------------------------------------------------------
# AUTHENTIFICATION ELASTICSEARCH (ingestion externe : Logstash/Beats/scripts)
# Deux volets independants, armes chacun par leur propre job :
#   - ES_050  -> token/cle API   -> state/factory_ingest_apikey.secret
#   - ES_050B -> mot de passe    -> state/factory_ingest_password.secret
# ES_AUTH_MODE choisit lequel utiliser a l'usage (token|password).
# Change ce choix a tout moment sans jamais bloquer l'autre volet.
# ---------------------------------------------------------------------
ES_AUTH_MODE="token"

# ---------------------------------------------------------------------
# WAZUH - comptes internes (indexer + API manager)
# Le blueprint d'origine mentionnait admin:admin / foo:bar en exemple :
# remplaces ici par des variables reelles, pas de valeur en dur non plus
# de ce cote.
#
# CORRIGE LE 2026-08-20 (incident reel wef-elk-core) : "admin"/"admin"
# n'a JAMAIS pu etre un mot de passe valide - la politique de mot de
# passe de Wazuh (outil wazuh-passwords-tool.sh) exige 8-64 caracteres
# avec au moins une majuscule, une minuscule, un chiffre et un symbole
# parmi .*+?- . C'est aussi le mot de passe humain de connexion a Wazuh
# Dashboard en mode KIBANA_AUTH_MODE=internal (voir plus bas). Le job
# WAZ_014A pousse reellement cette valeur vers le cluster (verification+
# alignement, jamais suppose a jour) - voir son en-tete et celui de
# WAZ_013C pour le detail complet de l'incident (WAZ_020_VERIFY -> 401
# security_exception).
#
# CORRIGE LE 2026-08-30 : la valeur elle-meme vivait encore en clair
# ici (meme si conforme a la politique). Deplacee vers secrets/, meme
# discipline que SMTP_PASS_FILE/FACTORY_SSH_PASSWORD_FILE ci-dessus.
# Ces deux mots de passe appartiennent entierement a cette usine
# (aucun systeme externe a satisfaire) : si le fichier est absent au
# moment ou WAZ_014A en a besoin, une valeur conforme est generee
# automatiquement (voir read_or_generate_secret, lib/commun.sh) - zero
# geste manuel requis pour un depot a froid sur une VM vierge.
# ---------------------------------------------------------------------
WAZ_INDEXER_ADMIN_USER="admin"
WAZ_INDEXER_ADMIN_PASSWORD_FILE="${INSTALL_DIR}/secrets/wazuh_indexer_admin_password.txt"
WAZ_API_USER="wazuh"
WAZ_API_PASSWORD_FILE="${INSTALL_DIR}/secrets/wazuh_api_password.txt"

# =====================================================================
# AUTHENTIFICATION KIBANA / WAZUH DASHBOARD (SSO) - AJOUTE LE 2026-08-11
# Sujet DIFFERENT de ES_AUTH_MODE plus haut : ES_AUTH_MODE concerne
# l'authentification MACHINE A MACHINE (Logstash/Beats/scripts qui
# ECRIVENT dans Elasticsearch). Ici, KIBANA_AUTH_MODE concerne
# l'authentification HUMAINE dans le navigateur, quand quelqu'un ouvre
# l'interface web Wazuh Dashboard (base sur OpenSearch Dashboards).
#
# 3 modes prevus, pour pouvoir proposer l'option qui correspond a
# l'infrastructure reelle du client (tous ne sont pas equipes pareil) :
#
#   internal (defaut) -> comportement actuel : compte local
#     WAZ_INDEXER_ADMIN_USER/PASSWORD ci-dessus, formulaire
#     utilisateur/mot de passe classique a chaque nouvelle session.
#     Ne necessite rien d'autre, fonctionne partout.
#
#   ldap -> Wazuh Dashboard verifie les identifiants directement
#     aupres de l'Active Directory du client via LDAP(S) (jobs
#     WAZ_017C_LDAPCONFIG). L'utilisateur tape TOUJOURS son
#     login/mot de passe dans le formulaire Kibana - ce n'est PAS le
#     comportement "sans mot de passe" - mais ce sont ses vrais
#     identifiants d'entreprise, geres centralement, plus de compte
#     Wazuh local a maintenir par utilisateur. Necessite un compte de
#     service AD (bind DN) fourni par l'administrateur du client.
#
#   saml -> vrai SSO via AD FS (ou Azure AD/Entra ID) : le navigateur
#     est redirige vers le fournisseur d'identite du client, qui
#     reconnait deja la session Windows/AD de l'utilisateur - AUCUN
#     formulaire (jobs WAZ_017D_SAMLCONFIG). C'est le comportement
#     exact decrit par l'utilisateur ("juste rafraichir, pas de mot de
#     passe"). Necessite un serveur AD FS deja existant chez le
#     client, avec ses metadonnees et son URL reels.
#
# DANS LES 3 CAS : aucune valeur n'est devinee ici. Les champs LDAP_*/
# SAML_* sont VIDES par defaut - a remplir uniquement avec les vraies
# informations fournies par l'administrateur AD/AD FS du client, jamais
# inventees. Si KIBANA_AUTH_MODE=ldap ou saml alors que les champs
# necessaires sont vides, WAZ_017B_AUTHMODE_CHECK arrete clairement
# l'orchestrateur au lieu d'improviser (meme logique que PKI_MODE=
# external cote PKI).
#
# ATTENTION IMPORTANTE : la syntaxe exacte des fichiers
# opensearch-security/config.yml et opensearch_dashboards.yml generee
# par WAZ_017C/WAZ_017D suit la documentation officielle du plugin de
# securite OpenSearch (dont Wazuh Dashboard est derive) au moment de
# l'ecriture de ce projet - a VALIDER contre la documentation Wazuh de
# la version exacte installee chez le client avant tout passage en
# production, la syntaxe pouvant evoluer d'une version a l'autre.
# =====================================================================
KIBANA_AUTH_MODE="internal"

# --- LDAP / Active Directory (utilise si KIBANA_AUTH_MODE=ldap) ---
LDAP_HOST=""                              # ex: ad.client.local
LDAP_PORT=389                             # 389 (LDAP) ou 636 (LDAPS)
LDAP_USE_SSL=false                        # true si LDAP_PORT=636
LDAP_BIND_DN=""                           # compte de service AD, ex: CN=svc-wazuh,OU=ServiceAccounts,DC=client,DC=local
# Mot de passe du compte de service AD : CORRIGE LE 2026-08-30, deplace
# vers secrets/ (systeme EXTERNE - jamais genere a la place du client) :
#   echo 'mot_de_passe' > secrets/ldap_bind_password.txt && chmod 600 secrets/ldap_bind_password.txt
LDAP_BIND_PASSWORD_FILE="${INSTALL_DIR}/secrets/ldap_bind_password.txt"
LDAP_USER_BASE_DN=""                      # ex: OU=Users,DC=client,DC=local
LDAP_USER_SEARCH_FILTER="(sAMAccountName={0})"
LDAP_ROLE_BASE_DN=""                      # ex: OU=Groups,DC=client,DC=local
LDAP_ROLE_SEARCH_FILTER="(member={0})"

# --- SAML / AD FS (utilise si KIBANA_AUTH_MODE=saml) ---
SAML_IDP_METADATA_URL=""                  # ex: https://adfs.client.local/federationmetadata/2007-06/federationmetadata.xml
SAML_IDP_ENTITY_ID=""                     # fourni par l'admin AD FS du client
SAML_SP_ENTITY_ID=""                      # identifiant de CE Wazuh Dashboard aupres de l'IdP, ex: https://kibana.client.local
SAML_KIBANA_URL=""                        # URL publique reelle de Wazuh Dashboard (utilisee dans le flux de redirection)
SAML_ROLES_KEY=""                         # attribut SAML qui porte les groupes AD de l'utilisateur, fourni par l'admin AD FS

# --- Correspondance role AD/SAML -> role Wazuh Dashboard (ldap ET saml) ---
# Un seul groupe mappe vers le role admin par defaut - a completer avec
# le client (plusieurs groupes/roles sont possibles, un seul suffit ici
# pour demarrer). Laisser vide = aucun mappage automatique, l'admin
# devra assigner les roles manuellement dans Wazuh Dashboard.
AUTH_ADMIN_GROUP_DN=""                    # ex: CN=SOC-Admins,OU=Groups,DC=client,DC=local

# ---------------------------------------------------------------------
# AGENT WAZUH (jobs WAG_001-006, actifs si WAZUH_AGENT est dans
# AGENT_COMPONENTS) - sur VM2 par defaut (avec Filebeat/Metricbeat en
# plus, les 3 sur la meme machine), ou sur tout autre hote Linux ou
# vous ne mettriez que WAZUH_AGENT dans AGENT_COMPONENTS. C'est LUI qui
# pousse les evenements vers le manager Wazuh (FACTORY_HOST_IP, port
# 1514/1515) - sans lui, rien n'alimente wazuh-manager. Le manager
# recoit directement des agents ; Logstash n'intervient PAS dans ce
# flux (il traite les LOGS via Filebeat/Metricbeat, un chemin
# totalement separe).
#
# AGENT_NAME doit etre UNIQUE par machine (VM2 y compris) : changez
# cette valeur avant chaque nouveau deploiement.
# WAZ_AGENT_PACKAGE_VERSION suit le meme principe que les autres
# versions du projet : vide = derniere version du depot, remplie =
# version exacte, jamais de changement automatique si deja installee.
# ---------------------------------------------------------------------
AGENT_NAME="vm2-beats-wazuh-agent"
WAZ_AGENT_PACKAGE_VERSION="4.14.7"

# ---------------------------------------------------------------------
# SORTIES LOGSTASH (job LS_024) - activables independamment, a la demande
# Le pipeline de sortie (/etc/logstash/conf.d/30-outputs.conf) est
# TOUJOURS regenere en entier a chaque execution de LS_024, a partir de
# ces trois interrupteurs - jamais d'accumulation, jamais de bloc
# fantome d'une execution precedente. On peut activer 0, 1, 2 ou les
# 3 sorties en meme temps (elles ne sont pas exclusives entre elles,
# contrairement a ES_AUTH_MODE qui choisit COMMENT s'authentifier).
# ---------------------------------------------------------------------
LS_OUTPUT_ES_ENABLED=true
LS_OUTPUT_FILE_ENABLED=false
LS_OUTPUT_FILE_PATH="/var/log/logstash/factory_output.jsonl"
LS_OUTPUT_S3_ENABLED=false

# ---------------------------------------------------------------------
# OBJECT STORAGE OVH (S3-compatible) - a remplir uniquement si vous
# activez LS_OUTPUT_S3_ENABLED et/ou ES_SNAPSHOT_S3_ENABLED ci-dessous.
# Laisse vide par defaut : aucune valeur inventee ici. OVH publie son
# endpoint S3 par region dans son espace client (ex. cellule Gravelines,
# Strasbourg...), a copier tel quel.
# ---------------------------------------------------------------------
OVH_S3_ENDPOINT="https://s3.rbx.io.cloud.ovh.net"
OVH_S3_REGION="rbx"
# ACCESS_KEY / SECRET_KEY : compte S3 dedie a creer sur le bucket
# ci-dessous (voir la marche a suivre donnee dans le chat) - ne jamais
# reutiliser un compte nominatif existant pour un job automatise.
OVH_S3_BUCKET="eug-storage-0624"
OVH_S3_ACCESS_KEY=""
OVH_S3_SECRET_KEY=""

# ---------------------------------------------------------------------
# SAUVEGARDE DES INDEX ELASTICSEARCH VERS S3 OVH (jobs ES_062/ES_063)
# Prepare mais desactive par defaut ("juste au cas ou"). Ces deux jobs
# ne bloquent rien d'autre (isoles, comme INFRA_001/002) et ne font
# rien tant que ES_SNAPSHOT_S3_ENABLED=false ou que les variables
# OVH_S3_* ci-dessus sont vides.
# ---------------------------------------------------------------------
ES_SNAPSHOT_S3_ENABLED=false
ES_SNAPSHOT_REPO_NAME="wef_s3_backup"
ES_SNAPSHOT_POLICY_NAME="wef_daily_snapshot"
ES_SNAPSHOT_SCHEDULE_CRON="0 30 1 * * ?"
ES_SNAPSHOT_RETENTION_DAYS=30

# AJOUTE LE 2026-08-31 (point #9 de la mission : jobs d'exploitation
# continue) - retention des index quotidiens wazuh-alerts-4.x-* sur
# wazuh-indexer (WAZ_014D_ALERTS_RETENTION.sh, politique ISM). Sans
# cela, ces index grossissent indefiniment - meme famille de risque
