# =====================================================================
#  WAZ_ELK_FACTORY (v2 - 225 jobs) - FICHIER DE VARIABLES
#  >>> C'EST LE SEUL FICHIER A MODIFIER POUR CHAQUE NOUVEL ENVIRONNEMENT <<<
#  Aucune valeur en dur dans les jobs : tout vient d'ici.
#  Meme regle d'or que wazuh_factory_2, adaptee a la topologie a 2 VM.
# =====================================================================

# ROLE de la machine sur laquelle ce dossier est joue :
#   ELK_HOST   -> VM1 : PKI + Elasticsearch + Logstash + Kibana + Wazuh
#                 (monolithique, pas de sous-choix).
#   AGENT_HOST -> TOUTE AUTRE machine (VM2, ou un hote Linux
#                 supplementaire) qui fait tourner un ou plusieurs
#                 agents. VOIR AGENT_COMPONENTS ci-dessous pour choisir
#                 LESQUELS tournent sur CETTE machine precise - les 3
#                 (Filebeat + Metricbeat + agent Wazuh) peuvent tourner
#                 ENSEMBLE sur la MEME machine (c'est le cas de VM2 par
#                 defaut dans ce projet), ou etre repartis chacun sur
#                 une machine differente si vous le preferez ailleurs -
#                 c'est le meme fichier jobs_table.csv/orchestrator.sh
#                 dans les deux cas, seul AGENT_COMPONENTS change.
#
#   Pour un hote Windows : utilisez jobs_windows/ (kit PowerShell
#   separe, meme logique de composants via $EnabledComponents dans
#   vars.ps1) au lieu de ce fichier.
ROLE=ELK_HOST

# QUELS AGENTS tournent sur cette machine - lu UNIQUEMENT si
# ROLE=AGENT_HOST (ignore si ROLE=ELK_HOST). Liste separee par des
# virgules, parmi FILEBEAT, METRICBEAT, WAZUH_AGENT. Exemple pour VM2
# (les 3 sur la meme machine, valeur par defaut de ce fichier) :
#   AGENT_COMPONENTS="FILEBEAT,METRICBEAT,WAZUH_AGENT"
# Exemple pour un hote Linux supplementaire qui ne doit avoir QUE
# l'agent Wazuh :
#   AGENT_COMPONENTS="WAZUH_AGENT"
#
# HOSTNAME_RENAME (job INFRA_002, projet-specifique, supprimable) :
# inclus par defaut pour VM2 (renomme la machine en BEATS_HOSTNAME) -
# retirez-le de la liste sur un hote Linux supplementaire generique si
# vous ne voulez pas qu'il soit renomme.
AGENT_COMPONENTS="FILEBEAT,METRICBEAT,WAZUH_AGENT,HOSTNAME_RENAME"

# Identite du projet (apparait dans les rapports et les certificats)
PROJECT_NAME="WAZ_ELK_FACTORY"

# ---------------------------------------------------------------------
# SAUT VOLONTAIRE DE JOBS NON BLOQUANTS (creneau demo/test limite)
# ---------------------------------------------------------------------
# AJOUTE LE 2026-08-14, suite a un cas reel : chez un client, l'environnement
# de test/demo peut n'etre accessible que sur une fenetre courte (ex: 30
# minutes) - certains jobs sont lents mais SANS IMPACT FONCTIONNEL sur la
# suite de la chaine (ex: ES_001, mise a jour OS - contrairement a un job
# comme le demarrage d'Elasticsearch, dont tout le reste depend
# reellement). Pour ces cas precis, decidez A L'AVANCE, avant meme de
# lancer ./orchestrator.sh, de sauter ces jobs pour gagner du temps :
#   SKIP_JOBS="ES_001"
# Liste separee par des virgules pour en sauter plusieurs :
#   SKIP_JOBS="ES_001,ES_046"
# CE N'EST PAS UNE ATTESTATION que le job a ete fait ailleurs (voir
# marquer_deja_fait.sh pour ce cas different) - c'est un choix assume que
# ce job precis n'a pas besoin de tourner CETTE fois-ci. L'orchestrateur
# le journalise distinctement (SAUTE_CONFIG dans l'historique, jamais
# confondu avec OK/ECHEC), marque sa condition satisfaite pour que la
# suite continue, et n'execute JAMAIS son script.
# Vide par defaut = comportement normal, aucun job saute.
SKIP_JOBS=""

